; CoreX STAGING - transcription lane (AT-523): TranscribeVoiceNoteJob (up to 20 min) had no worker on Staging. Remove this file + supervisorctl update to undo.
[program:corex-worker-staging-transcription]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 10 php /corex-staging/artisan queue:work database --queue=transcription --sleep=3 --tries=1 --timeout=1260 --max-time=3600
directory=/corex-staging
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/corex-staging/storage/logs/worker-transcription.log
stopwaitsecs=1300
