; ============================================================================
; CoreX — prospecting thumbnail download queue worker
; ============================================================================
;
; DEPLOY ARTIFACT. Install as its OWN file at
; /etc/supervisor/conf.d/corex-worker-thumbnails.conf on each host that runs
; prospecting (live: /corex), then:
;
;     sudo supervisorctl reread
;     sudo supervisorctl update
;     sudo supervisorctl status | grep thumbnails
;
; Its own file rather than another block appended to corex-worker.conf: this
; lane is self-contained and a separate file is removable by deleting it,
; without an edit to the shared config every other lane depends on.
;
; WHY THIS LANE EXISTS (incident 2026-09-14):
; DownloadListingThumbnail used to run on `default`. It is network-bound (~1-2s
; of CDN fetch + GD downscale each) and arrives in BULK — one
; `prospecting:rehydrate-thumbnails` run dispatches one job per listing. On
; 2026-09-14 such a run put 5,226 of them on `default`, whose worker is
; numprocs=1. At ~0.65 jobs/sec that is ~2h15m of image downloads, and because
; a database queue is strict FIFO, every fast scheduled job queued behind them.
;
; The casualty that mattered was not the photos — it was the LEADS.
; PullP24LeadsJob and PullPpLeadsJob run every 5 minutes, so each new portal
; lead check joined the back of a 5,300-job line. Inbound buyer enquiries from
; Property24 and PrivateProperty stopped reaching CoreX for the duration. No
; job failed, no worker died, nothing turned red — the alarm fired on backlog
; age and recommended restarting the worker, which would have changed nothing.
;
; This is the same shape as the TranscribeVoiceNoteJob incident of 2026-08-27
; and it takes the same answer: slow bulk work does not share a lane with
; latency-sensitive scheduled work.
;
; WHY NOT REUSE p24images:
; That lane is deliberately NARROW to stay under P24's per-IP limiter (see
; corex-worker-p24.conf). Borrowing it would simply move the head-of-line block
; onto the P24 import gallery pipeline instead. Different upstream, different
; lane.
;
; SIZING — 4 procs:
; These fetch from prospecting portal CDNs, not P24's API, so the p24images cap
; does not apply; but 4 is deliberately modest rather than "as wide as
; possible". It lifts throughput ~3.7x (0.65 -> ~2.4 jobs/sec, measured on live
; 2026-09-14), clearing a 5k bulk run in ~25 minutes instead of ~2h15m, without
; becoming a download storm against a third-party CDN. Raise it only with a
; measured reason.
;
; --memory=512 because handle() decodes the FULL-RES image into memory via GD
; (imagecreatefromstring) before downscaling to 300px; the 128MB default is not
; a safe ceiling for a large source photo.
;
; The lane is registered in config/queue_alerting.php as a BATCH lane
; (requires_progress) — a deep queue here is its normal steady state, so depth
; alone must not alarm; a head that stops advancing must.
; ============================================================================

[program:corex-worker-live-thumbnails]
process_name=%(program_name)s_%(process_num)02d
command=php /corex/artisan queue:work --queue=thumbnails --sleep=3 --tries=2 --max-time=3600 --memory=512
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/corex/storage/logs/worker-thumbnails.log
stopwaitsecs=90
