; CoreX STAGING - p24 lane (AT-523): SyncP24LocationsJob (Importer page button, up to 1 h) had no worker. Remove this file + supervisorctl update to undo.
[program:corex-worker-staging-p24]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 19 php /corex-staging/artisan queue:work database --queue=p24 --sleep=3 --tries=1 --timeout=3660 --max-time=3600
directory=/corex-staging
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/corex-staging/storage/logs/worker-p24.log
stopwaitsecs=3700
