; CoreX STAGING - buyer-matching lane (AT-523). RegenerateBuyerMatchesJob has a 600 s timeout; on the shared staging worker (default 60 s) it was killed
; and ended as MaxAttemptsExceeded. Own worker with --timeout above the job's. Remove this file + `supervisorctl update` to undo.
[program:corex-worker-staging-buyer-matching]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 10 php /corex-staging/artisan queue:work database --queue=buyer-matching --sleep=3 --tries=1 --timeout=610 --max-time=3600
directory=/corex-staging
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/corex-staging/storage/logs/worker-buyer-matching.log
stopwaitsecs=620
