; CoreX STAGING - thumbnails lane (AT-523). DownloadListingThumbnail is network-bound and arrives in bulk; Staging had NO worker for it (438 jobs, oldest 120 h, 31 Oct 2026).
; Mirrors the demo box's `corex-worker-demo` coverage and config/queue_alerting.php's `thumbnails` lane. Remove this file + `supervisorctl update` to undo.
[program:corex-worker-staging-thumbnails]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 10 php /corex-staging/artisan queue:work database --queue=thumbnails --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/corex-staging
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/corex-staging/storage/logs/worker-thumbnails.log
stopwaitsecs=120
