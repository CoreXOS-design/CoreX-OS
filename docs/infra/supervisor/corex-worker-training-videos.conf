; ============================================================================
; CoreX — Training Videos compression queue worker (spec .ai/specs/training-videos.md §8 U5)
; ============================================================================
;
; DEPLOY ARTIFACT. Install as its OWN file in /etc/supervisor/conf.d/ on each host that
; serves the Training Videos page, then:
;
;     sudo supervisorctl reread
;     sudo supervisorctl update
;     sudo supervisorctl status | grep training-videos
;
; WHY ITS OWN LANE: shrinking an uploaded video with ffmpeg can run for most of an hour. On the
; `default` queue (or any lane an agent is waiting on) it would block e-mail, matching and
; portal-lead pulls behind it — the same head-of-line failure as the thumbnails (2026-09-14) and
; transcription (2026-08-27) incidents. One process, lowest CPU priority; ffmpeg itself is also
; limited to half the cores and `nice`d inside the job.
;
; --timeout must exceed the job's own $timeout (3600s) so the job's failure handler runs instead
; of the worker killing it silently. The lane is registered in config/queue_alerting.php as a
; BATCH lane (a head that stops advancing alarms; a busy lane does not).
;
; LIVE host (/corex): use this program as-is.
; STAGING host: same block with `corex-worker-staging-training-videos`, /corex-staging paths
; (see /etc/supervisor/conf.d/corex-worker-staging-training-videos.conf on the Staging box).
; ============================================================================

[program:corex-worker-live-training-videos]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 19 php /corex/artisan queue:work database --queue=training-videos --sleep=3 --tries=2 --max-time=3600 --timeout=3660 --memory=512
directory=/corex
autostart=true
autorestart=true
startretries=60
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/corex/storage/logs/worker-training-videos.log
stopwaitsecs=3700
