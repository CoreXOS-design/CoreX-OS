# SECOND LAYER for .ai/specs/private-document-storage.md  (security fix, 24 Oct 2026)
#
# Documents are moved off the public disk by `php artisan documents:privatise` and nothing writes
# them there any more. This block makes nginx refuse the document sub-folders of /storage/ even if a
# future bug or a restored backup puts a file back. Property photos (/storage/properties/<id>/<file>.jpg
# and /storage/properties/<id>/thumbs/...), agent photos, logos and portal images keep working.
#
# NOT applied by the code change. Andre applies it on LIVE and STAGING (not edited by the lane):
#   1. Paste this block INSIDE each `server { ... }` that serves the CoreX app, ABOVE the generic
#      `location /` / the PHP location (regex locations are matched in order; "^~" is not used here
#      on purpose so it also wins over a static-file location for /storage).
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. Verify (expect 404 for both lines):
#        curl -sI https://<host>/storage/properties/1/files/x.pdf | head -1
#        curl -sI https://<host>/storage/fica/1/x.pdf | head -1
#      and that a property photo URL still returns 200.

location ~* ^/storage/(properties/[0-9]+/(files|rental-inspection-signatures|rental-inventory-signatures|rental-inventory-buyer-acceptances)|contacts|fica|take-on-docs|esign|agent-docs)/ {
    return 404;
}
